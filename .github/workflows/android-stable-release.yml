name: Read∞ Stable Android All ABI Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Public release tag'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  NEXT_PUBLIC_APP_PLATFORM: tauri
  NEXT_PUBLIC_FEATURE_ENABLE_AI: '0'
  NEXT_PUBLIC_FEATURE_ENABLE_CLOUD: '0'
  NEXT_PUBLIC_FEATURE_ENABLE_SYNC: '0'
  NEXT_PUBLIC_FEATURE_ENABLE_TELEMETRY: '0'
  NEXT_PUBLIC_DEFAULT_SUPABASE_URL_BASE64: aHR0cHM6Ly9sb2NhbGhvc3Q=
  NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-release-test-key
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_STRIP: symbols

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore workspace source dependencies
        run: |
          git clone --depth 1 https://github.com/readest/foliate-js.git packages/foliate-js
          git clone --depth 1 https://github.com/readest/simplecc-wasm.git packages/simplecc-wasm
          git clone --depth 1 https://github.com/readest/js-mdict.git packages/js-mdict
          git clone --depth 1 https://github.com/readest/tauri.git packages/tauri
          git clone --depth 1 https://github.com/readest/tauri-plugins-workspace.git packages/tauri-plugins
          git clone --depth 1 https://github.com/mozilla/pdf.js.qcms.git packages/qcms
          git clone --depth 1 https://github.com/readest/tao.git packages/tao
          git clone --depth 1 https://github.com/readest/tauri-plugin-turso.git apps/readest-app/src-tauri/plugins/tauri-plugin-turso
          git clone --depth 1 https://github.com/readest/tauri-plugin-webview-upgrade.git apps/readest-app/src-tauri/plugins/tauri-plugin-webview-upgrade

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/readest-app/src-tauri -> target
          key: android-all-abi-release

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare local reader vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Initialize Android project
        run: pnpm --filter @readest/readest-app tauri android init

      - name: Regenerate native launcher icons
        working-directory: apps/readest-app
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pil
          cmp -s src-tauri/icons/icon.png public/icon.png
          pnpm tauri icon src-tauri/icons/icon.png
          python3 scripts/prepare_android_launcher_icons.py \
            --source src-tauri/icons/icon.png \
            --res-dir src-tauri/gen/android/app/src/main/res
          test -s src-tauri/gen/android/app/src/main/res/drawable/ic_launcher_background.xml
          test -s src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Pin Android package and launcher label
        run: |
          app_gradle="apps/readest-app/src-tauri/gen/android/app/build.gradle.kts"
          manifest="apps/readest-app/src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          grep -q 'applicationId = "com.infinity.readz"' "$app_gradle" || sed -i 's/applicationId = ".*"/applicationId = "com.infinity.readz"/' "$app_gradle"
          grep -q 'namespace = "com.infinity.readz"' "$app_gradle" || sed -i 's/namespace = ".*"/namespace = "com.infinity.readz"/' "$app_gradle"
          sed -i 's/android:label="@string\/main_activity_title"/android:label="Read∞"/g' "$manifest"
          sed -i 's/android:label="@string\/app_name"/android:label="Read∞"/g' "$manifest"
          grep -F 'applicationId = "com.infinity.readz"' "$app_gradle"
          grep -F 'namespace = "com.infinity.readz"' "$app_gradle"
          grep -F 'android:label="Read∞"' "$manifest"

      - name: Configure Android MainActivity
        run: |
          set -euo pipefail
          activity_file="$(find apps/readest-app/src-tauri/gen/android/app/src/main/java -name MainActivity.kt -print -quit)"
          test -n "$activity_file"
          if ! grep -q 'ReadInfinityBackDispatch' "$activity_file"; then
            sed -i '/^package /a import android.content.Intent\nimport android.os.Build\nimport android.view.KeyEvent\nimport android.webkit.WebView\nimport android.widget.Toast\nimport androidx.activity.OnBackPressedCallback\nimport com.readest.native_bridge.KeyDownInterceptor\nimport com.readest.native_bridge.NativeBridgePlugin' "$activity_file"
            sed -i 's/class MainActivity : TauriActivity()/class MainActivity : TauriActivity(), KeyDownInterceptor/' "$activity_file"
            sed -i '/super.onCreate(savedInstanceState)/a\        setupReadInfinityBackDispatcher()' "$activity_file"
            last_line="$(awk 'NF { line = NR } END { print line }' "$activity_file")"
            sed -i "${last_line}d" "$activity_file"
            cat >> "$activity_file" <<'KOTLIN'
              // ReadInfinityBackDispatch: forward Android Back to the JS dialog,
              // folder, settings, or reader stack before considering app exit.
              private var webViewForNativeKeys: WebView? = null
              private var interceptBackKeyEnabled = false
              private var interceptVolumeKeysEnabled = false
              private var interceptPageTurnerKeysEnabled = false
              private var keyLearnModeEnabled = false
              private var lastBackPressAt = 0L
              private val exitPressWindowMs = 2000L

              override fun onWebViewCreate(webView: WebView) {
                  webViewForNativeKeys = webView
              }

              override fun interceptVolumeKeys(enabled: Boolean) {
                  interceptVolumeKeysEnabled = enabled
              }

              override fun interceptBackKey(enabled: Boolean) {
                  interceptBackKeyEnabled = enabled
              }

              override fun interceptPageTurnerKeys(enabled: Boolean) {
                  interceptPageTurnerKeysEnabled = enabled
              }

              override fun setKeyLearnMode(enabled: Boolean) {
                  keyLearnModeEnabled = enabled
              }

              private fun forwardNativeKey(keyName: String, keyCode: Int) {
                  webViewForNativeKeys?.evaluateJavascript(
                      """try { window.onNativeKeyDown("$keyName", $keyCode); } catch (_) {}""",
                      null
                  )
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN) {
                      val keyName = when (event.keyCode) {
                          KeyEvent.KEYCODE_BACK -> "Back"
                          KeyEvent.KEYCODE_VOLUME_UP -> "VolumeUp"
                          KeyEvent.KEYCODE_VOLUME_DOWN -> "VolumeDown"
                          KeyEvent.KEYCODE_MEDIA_NEXT -> "MediaNext"
                          KeyEvent.KEYCODE_MEDIA_PREVIOUS -> "MediaPrevious"
                          KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> "MediaPlayPause"
                          KeyEvent.KEYCODE_MEDIA_FAST_FORWARD -> "MediaFastForward"
                          KeyEvent.KEYCODE_MEDIA_REWIND -> "MediaRewind"
                          else -> null
                      }
                      val shouldForward = when (event.keyCode) {
                          KeyEvent.KEYCODE_BACK -> interceptBackKeyEnabled
                          KeyEvent.KEYCODE_VOLUME_UP, KeyEvent.KEYCODE_VOLUME_DOWN ->
                              interceptVolumeKeysEnabled || keyLearnModeEnabled
                          KeyEvent.KEYCODE_MEDIA_NEXT,
                          KeyEvent.KEYCODE_MEDIA_PREVIOUS,
                          KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE,
                          KeyEvent.KEYCODE_MEDIA_FAST_FORWARD,
                          KeyEvent.KEYCODE_MEDIA_REWIND ->
                              interceptPageTurnerKeysEnabled || keyLearnModeEnabled
                          else -> false
                      }
                      if (keyName != null && shouldForward) {
                          forwardNativeKey(keyName, event.keyCode)
                          return true
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

              private fun finishAfterSecondBackPress() {
                  val now = System.currentTimeMillis()
                  if (now - lastBackPressAt <= exitPressWindowMs) {
                      finish()
                  } else {
                      lastBackPressAt = now
                      Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun handleReadInfinityBackPress() {
                  if (interceptBackKeyEnabled) {
                      forwardNativeKey("Back", KeyEvent.KEYCODE_BACK)
                  } else {
                      finishAfterSecondBackPress()
                  }
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  handleReadInfinityBackPress()
              }

              private fun setupReadInfinityBackDispatcher() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      onBackInvokedDispatcher.registerOnBackInvokedCallback(
                          android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                          android.window.OnBackInvokedCallback {
                              handleReadInfinityBackPress()
                          }
                      )
                  }
                  onBackPressedDispatcher.addCallback(this,
                      object : OnBackPressedCallback(true) {
                          override fun handleOnBackPressed() {
                              handleReadInfinityBackPress()
                          }
                      }
                  )
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  NativeBridgePlugin.deliverActivityResult(requestCode, resultCode, data)
              }
          }
          KOTLIN
          fi
          grep -F 'ReadInfinityBackDispatch' "$activity_file"
          grep -F 'class MainActivity : TauriActivity(), KeyDownInterceptor' "$activity_file"
          grep -F 'interceptBackKeyEnabled' "$activity_file"
          grep -F 'Press back again to exit' "$activity_file"
          grep -F 'NativeBridgePlugin.deliverActivityResult' "$activity_file"
          tail -n 80 "$activity_file"

      - name: Configure native AMOLED startup theme
        run: |
          set -euo pipefail
          res_dir="apps/readest-app/src-tauri/gen/android/app/src/main/res"
          theme_file="$(find "$res_dir" -maxdepth 2 -type f \( -path '*/values/themes.xml' -o -path '*/values/styles.xml' \) -print -quit)"
          test -n "$theme_file"
          cat > "$res_dir/values/readinfinity_theme_colors.xml" <<'XML'
          <resources>
            <color name="readinfinity_startup_black">#000000</color>
          </resources>
          XML
          if grep -q 'android:windowBackground' "$theme_file"; then
            sed -i 's|<item name="android:windowBackground">[^<]*</item>|<item name="android:windowBackground">@color/readinfinity_startup_black</item>|' "$theme_file"
          else
            sed -i '/<style name="Theme\.readest"/a\    <item name="android:windowBackground">@color/readinfinity_startup_black</item>' "$theme_file"
          fi
          if ! grep -q 'android:windowSplashScreenBackground' "$theme_file"; then
            sed -i '/<style name="Theme\.readest"/a\    <item name="android:windowSplashScreenBackground">@color/readinfinity_startup_black</item>' "$theme_file"
          fi
          if grep -q 'android:statusBarColor' "$theme_file"; then
            sed -i 's|<item name="android:statusBarColor">[^<]*</item>|<item name="android:statusBarColor">@android:color/black</item>|' "$theme_file"
          else
            sed -i '/<style name="Theme\.readest"/a\    <item name="android:statusBarColor">@android:color/black</item>' "$theme_file"
          fi
          if grep -q 'android:navigationBarColor' "$theme_file"; then
            sed -i 's|<item name="android:navigationBarColor">[^<]*</item>|<item name="android:navigationBarColor">@android:color/black</item>|' "$theme_file"
          else
            sed -i '/<style name="Theme\.readest"/a\    <item name="android:navigationBarColor">@android:color/black</item>' "$theme_file"
          fi
          if ! grep -q 'android:windowLightStatusBar' "$theme_file"; then
            sed -i '/<style name="Theme\.readest"/a\    <item name="android:windowLightStatusBar">false</item>' "$theme_file"
          fi
          if ! grep -q 'android:windowLightNavigationBar' "$theme_file"; then
            sed -i '/<style name="Theme\.readest"/a\    <item name="android:windowLightNavigationBar">false</item>' "$theme_file"
          fi
          grep -F 'readinfinity_startup_black' "$theme_file"
          grep -F 'android:windowSplashScreenBackground' "$theme_file"
          grep -F 'android:statusBarColor' "$theme_file"

      - name: Select FOSS Android flavor
        run: |
          app_gradle="apps/readest-app/src-tauri/gen/android/app/build.gradle.kts"
          if ! grep -q 'missingDimensionStrategy("store"' "$app_gradle"; then
            sed -i '/minSdk =/a\        missingDimensionStrategy("store", "foss")' "$app_gradle"
          fi
          grep -n 'missingDimensionStrategy("store"' "$app_gradle"

      - name: Configure Android release signing
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEY_BASE64 || secrets.SIGNING_KEY_BASE64 || secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEY_ALIAS" || { echo 'Missing Android signing key alias secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing Android signing key password secret'; exit 1; }
          test -n "$KEYSTORE_BASE64" || { echo 'Missing Android keystore base64 secret'; exit 1; }
          keystore_file="$RUNNER_TEMP/readinfinity-release.jks"
          base64 --decode <<< "$KEYSTORE_BASE64" > "$keystore_file"
          test -s "$keystore_file"
          test -n "$STORE_PASSWORD" || { echo 'Missing Android keystore store password secret'; exit 1; }
          {
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'password=%s\n' "$KEY_PASSWORD"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'storeFile=%s\n' "$keystore_file"
          } > apps/readest-app/src-tauri/gen/android/keystore.properties
          chmod 600 apps/readest-app/src-tauri/gen/android/keystore.properties
          {
            printf 'READINFINITY_KEYSTORE_FILE=%s\n' "$keystore_file"
            printf 'READINFINITY_KEY_ALIAS=%s\n' "$KEY_ALIAS"
            printf 'READINFINITY_KEY_PASSWORD=%s\n' "$KEY_PASSWORD"
            printf 'READINFINITY_STORE_PASSWORD=%s\n' "$STORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android APK variants
        working-directory: apps/readest-app
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/readinfinity-apks"
          mkdir -p "$output_dir"
          for target in aarch64 armv7 i686 x86_64; do
            rm -rf src-tauri/gen/android/app/build
            pnpm tauri android build -t "$target" --apk
            case "$target" in
              aarch64) abi='arm64-v8a' ;;
              armv7) abi='armeabi-v7a' ;;
              i686) abi='x86' ;;
              x86_64) abi='x86_64' ;;
            esac
            unsigned_apk="$(find src-tauri/gen/android -type f -path '*/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk' -print -quit)"
            test -n "$unsigned_apk"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$READINFINITY_KEYSTORE_FILE" \
              --ks-key-alias "$READINFINITY_KEY_ALIAS" \
              --ks-pass env:READINFINITY_STORE_PASSWORD \
              --key-pass env:READINFINITY_KEY_PASSWORD \
              --out "$output_dir/$abi.apk" \
              "$unsigned_apk"
            test -s "$output_dir/$abi.apk"
            echo "Built and signed $abi from Tauri target $target"
          done
          ls -lh "$output_dir"

      - name: Verify package, branding, signature, and all ABIs
        id: apk
        working-directory: apps/readest-app
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/readinfinity-apks"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          version="$(node -p "require('./package.json').version")"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            apk_path="$output_dir/$abi.apk"
            test -s "$apk_path"
            badging="$("$build_tools/aapt" dump badging "$apk_path")"
            printf '%s\n' "--- $abi badging ---"
            printf '%s\n' "$badging"
            grep -F "com.infinity.readz" <<< "$badging"
            grep -F "Read∞" <<< "$badging"
            "$build_tools/apksigner" verify --verbose "$apk_path"
            unzip -l "$apk_path" | grep -q "lib/$abi/"
            for other in arm64-v8a armeabi-v7a x86 x86_64; do
              if [ "$other" != "$abi" ] && unzip -l "$apk_path" | grep -q "lib/$other/"; then
                echo "Unexpected $other native library found in $abi APK"
                exit 1
              fi
            done
            release_asset="ReadInfinity_${version}_${abi}.apk"
            cp "$apk_path" "$release_asset"
            sha256sum "$release_asset" | tee "$release_asset.sha256"
            case "$abi" in
              arm64-v8a) echo "arm64_asset=$release_asset" >> "$GITHUB_OUTPUT" ;;
              armeabi-v7a) echo "armv7_asset=$release_asset" >> "$GITHUB_OUTPUT" ;;
              x86) echo "x86_asset=$release_asset" >> "$GITHUB_OUTPUT" ;;
              x86_64) echo "x86_64_asset=$release_asset" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "Verified signed $abi APK: $release_asset"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload all ABI build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: readinfinity-android-all-abi-release-${{ github.sha }}
          path: |
            apps/readest-app/${{ steps.apk.outputs.arm64_asset }}
            apps/readest-app/${{ steps.apk.outputs.arm64_asset }}.sha256
            apps/readest-app/${{ steps.apk.outputs.armv7_asset }}
            apps/readest-app/${{ steps.apk.outputs.armv7_asset }}.sha256
            apps/readest-app/${{ steps.apk.outputs.x86_asset }}
            apps/readest-app/${{ steps.apk.outputs.x86_asset }}.sha256
            apps/readest-app/${{ steps.apk.outputs.x86_64_asset }}
            apps/readest-app/${{ steps.apk.outputs.x86_64_asset }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Create or update public GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        working-directory: apps/readest-app
        run: |
          set -euo pipefail
          release_title="Read∞ ${{ steps.apk.outputs.version }}"
          release_notes="Stable Read∞ Android release. Package: com.infinity.readz. Version: ${{ steps.apk.outputs.version }}. All Android ABI variants included: arm64-v8a, armeabi-v7a, x86, and x86_64. Books and dictionaries are read directly from selected device folders; local metadata remains on-device. This build uses the supplied Read∞ icon and requires a second Android Back press within two seconds before exiting. Credits and license information are available in the repository README."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi
          gh release create "$RELEASE_TAG" \
            "${{ steps.apk.outputs.arm64_asset }}" \
            "${{ steps.apk.outputs.armv7_asset }}" \
            "${{ steps.apk.outputs.x86_asset }}" \
            "${{ steps.apk.outputs.x86_64_asset }}" \
            --title "$release_title" \
            --target "$GITHUB_SHA" \
            --notes "$release_notes"

      - name: Publish GitHub updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        working-directory: apps/readest-app
        run: |
          set -euo pipefail
          version="${{ steps.apk.outputs.version }}"
          release_base="https://github.com/ZHINFINITY/ReadInfinity/releases/download/${RELEASE_TAG}/"
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "${{ steps.apk.outputs.version }}: Read∞ Android release with the supplied icon, InfinityZ-Lab creator credit, and two-press Back-to-exit behavior." \
            --arg arm64_url "${release_base}${{ steps.apk.outputs.arm64_asset }}" \
            --arg armv7_url "${release_base}${{ steps.apk.outputs.armv7_asset }}" \
            --arg x86_url "${release_base}${{ steps.apk.outputs.x86_asset }}" \
            --arg x86_64_url "${release_base}${{ steps.apk.outputs.x86_64_asset }}" \
            '{version: $version, pub_date: $pub_date, notes: $notes, platforms: {
              "android-arm64": {url: $arm64_url},
              "android-armeabi-v7a": {url: $armv7_url},
              "android-x86": {url: $x86_url},
              "android-x86_64": {url: $x86_64_url}
            }}' > latest.json
          jq empty latest.json
          test -f release-notes.json
          gh release upload "$RELEASE_TAG" latest.json release-notes.json --clobber

      - name: Attest arm64-v8a APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/readest-app/${{ steps.apk.outputs.arm64_asset }}

      - name: Attest armeabi-v7a APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/readest-app/${{ steps.apk.outputs.armv7_asset }}

      - name: Attest x86 APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/readest-app/${{ steps.apk.outputs.x86_asset }}

      - name: Attest x86_64 APK
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: apps/readest-app/${{ steps.apk.outputs.x86_64_asset }}

      - name: Print release summary
        run: |
          echo "Release tag: ${{ inputs.release_tag }}"
          echo "Version: ${{ steps.apk.outputs.version }}"
          echo "Package: com.infinity.readz"
          echo "Brand: Read∞"
          echo "APKs: ${{ steps.apk.outputs.arm64_asset }}, ${{ steps.apk.outputs.armv7_asset }}, ${{ steps.apk.outputs.x86_asset }}, ${{ steps.apk.outputs.x86_64_asset }}"
          echo "Architectures: arm64-v8a, armeabi-v7a, x86, and x86_64"
          echo "Commit: $GITHUB_SHA"
          echo "Public releases: https://github.com/ZHINFINITY/ReadInfinity/releases"
          echo "Artifact: https://github.com/ZHINFINITY/readinfinity/actions/runs/$GITHUB_RUN_ID"
          echo "Artifact attestations: enabled for all four APKs"
          echo "APK signatures verified with apksigner."
          echo "Read∞ all-ABI release workflow completed."
          echo ""
          echo "SHA256 arm64-v8a:"
          cat "apps/readest-app/${{ steps.apk.outputs.arm64_asset }}.sha256"
          echo "SHA256 armeabi-v7a:"
          cat "apps/readest-app/${{ steps.apk.outputs.armv7_asset }}.sha256"
          echo "SHA256 x86:"
          cat "apps/readest-app/${{ steps.apk.outputs.x86_asset }}.sha256"
          echo "SHA256 x86_64:"
          cat "apps/readest-app/${{ steps.apk.outputs.x86_64_asset }}.sha256"

      - name: Upload all-ABI release metadata
        uses: actions/upload-artifact@v7
        with:
          name: readinfinity-all-abi-release-metadata-${{ github.sha }}
          path: |
            apps/readest-app/${{ steps.apk.outputs.arm64_asset }}.sha256
            apps/readest-app/${{ steps.apk.outputs.armv7_asset }}.sha256
            apps/readest-app/${{ steps.apk.outputs.x86_asset }}.sha256
            apps/readest-app/${{ steps.apk.outputs.x86_64_asset }}.sha256
          if-no-files-found: error
          retention-days: 90
