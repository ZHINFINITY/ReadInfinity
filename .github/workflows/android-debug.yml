name: Read∞ Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-debug:
    name: Build arm64 Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_DEFAULT_SUPABASE_URL_BASE64: aHR0cHM6Ly9sb2NhbGhvc3Q=
      NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-ci-test-key
      # Keep the APK debuggable for device testing, but do not package the
      # enormous Rust DWARF symbol table into libreadestlib.so. The previous
      # unstripped arm64 debug library alone was about 629 MB.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_STRIP: symbols
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore workspace source dependencies
        run: |
          git clone --depth 1 https://github.com/readest/foliate-js.git packages/foliate-js
          git clone --depth 1 https://github.com/readest/simplecc-wasm.git packages/simplecc-wasm
          git clone --depth 1 https://github.com/readest/js-mdict.git packages/js-mdict
          git clone --depth 1 https://github.com/readest/tauri.git packages/tauri
          git clone --depth 1 https://github.com/readest/tauri-plugins-workspace.git packages/tauri-plugins
          git clone --depth 1 https://github.com/mozilla/pdf.js.qcms.git packages/qcms
          git clone --depth 1 https://github.com/readest/tao.git packages/tao
          git clone --depth 1 https://github.com/readest/tauri-plugin-turso.git apps/readest-app/src-tauri/plugins/tauri-plugin-turso
          git clone --depth 1 https://github.com/readest/tauri-plugin-webview-upgrade.git apps/readest-app/src-tauri/plugins/tauri-plugin-webview-upgrade

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare local reader vendors
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: Initialize Android project
        run: pnpm --filter @readest/readest-app tauri android init

      - name: Regenerate native launcher icons
        working-directory: apps/readest-app
        run: |
          set -euo pipefail
          cmp -s src-tauri/icons/icon.png public/icon.png
          pnpm tauri icon src-tauri/icons/icon.png

      - name: Configure Android MainActivity
        run: |
          set -euo pipefail
          activity_file="$(find apps/readest-app/src-tauri/gen/android/app/src/main/java -name MainActivity.kt -print -quit)"
          test -n "$activity_file"
          if ! grep -q 'ReadInfinityBackDispatch' "$activity_file"; then
            sed -i '/^package /a import android.content.Intent\nimport android.os.Build\nimport android.view.KeyEvent\nimport android.webkit.WebView\nimport androidx.activity.OnBackPressedCallback\nimport com.readest.native_bridge.KeyDownInterceptor\nimport com.readest.native_bridge.NativeBridgePlugin' "$activity_file"
            sed -i 's/class MainActivity : TauriActivity()/class MainActivity : TauriActivity(), KeyDownInterceptor/' "$activity_file"
            sed -i '/super.onCreate(savedInstanceState)/a\        setupReadInfinityBackDispatcher()' "$activity_file"
            last_line="$(awk 'NF { line = NR } END { print line }' "$activity_file")"
            sed -i "${last_line}d" "$activity_file"
            cat >> "$activity_file" <<'KOTLIN'
              // ReadInfinityBackDispatch: forward Android Back to the JS dialog
              // stack before allowing the activity to finish.
              private var webViewForNativeKeys: WebView? = null
              private var interceptBackKeyEnabled = false
              private var interceptVolumeKeysEnabled = false
              private var interceptPageTurnerKeysEnabled = false
              private var keyLearnModeEnabled = false

              override fun onWebViewCreate(webView: WebView) {
                  webViewForNativeKeys = webView
              }

              override fun interceptVolumeKeys(enabled: Boolean) {
                  interceptVolumeKeysEnabled = enabled
              }

              override fun interceptBackKey(enabled: Boolean) {
                  interceptBackKeyEnabled = enabled
              }

              override fun interceptPageTurnerKeys(enabled: Boolean) {
                  interceptPageTurnerKeysEnabled = enabled
              }

              override fun setKeyLearnMode(enabled: Boolean) {
                  keyLearnModeEnabled = enabled
              }

              private fun forwardNativeKey(keyName: String, keyCode: Int) {
                  webViewForNativeKeys?.evaluateJavascript(
                      """try { window.onNativeKeyDown("$keyName", $keyCode); } catch (_) {}""",
                      null
                  )
              }

              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.action == KeyEvent.ACTION_DOWN) {
                      val keyName = when (event.keyCode) {
                          KeyEvent.KEYCODE_BACK -> "Back"
                          KeyEvent.KEYCODE_VOLUME_UP -> "VolumeUp"
                          KeyEvent.KEYCODE_VOLUME_DOWN -> "VolumeDown"
                          KeyEvent.KEYCODE_MEDIA_NEXT -> "MediaNext"
                          KeyEvent.KEYCODE_MEDIA_PREVIOUS -> "MediaPrevious"
                          KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE -> "MediaPlayPause"
                          KeyEvent.KEYCODE_MEDIA_FAST_FORWARD -> "MediaFastForward"
                          KeyEvent.KEYCODE_MEDIA_REWIND -> "MediaRewind"
                          else -> null
                      }
                      val shouldForward = when (event.keyCode) {
                          KeyEvent.KEYCODE_BACK -> interceptBackKeyEnabled
                          KeyEvent.KEYCODE_VOLUME_UP, KeyEvent.KEYCODE_VOLUME_DOWN ->
                              interceptVolumeKeysEnabled || keyLearnModeEnabled
                          KeyEvent.KEYCODE_MEDIA_NEXT,
                          KeyEvent.KEYCODE_MEDIA_PREVIOUS,
                          KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE,
                          KeyEvent.KEYCODE_MEDIA_FAST_FORWARD,
                          KeyEvent.KEYCODE_MEDIA_REWIND ->
                              interceptPageTurnerKeysEnabled || keyLearnModeEnabled
                          else -> false
                      }
                      if (keyName != null && shouldForward) {
                          forwardNativeKey(keyName, event.keyCode)
                          return true
                      }
                  }
                  return super.dispatchKeyEvent(event)
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (interceptBackKeyEnabled) {
                      forwardNativeKey("Back", KeyEvent.KEYCODE_BACK)
                  } else {
                      super.onBackPressed()
                  }
              }

              private fun setupReadInfinityBackDispatcher() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      onBackInvokedDispatcher.registerOnBackInvokedCallback(
                          android.window.OnBackInvokedDispatcher.PRIORITY_DEFAULT,
                          android.window.OnBackInvokedCallback {
                              if (interceptBackKeyEnabled) {
                                  forwardNativeKey("Back", KeyEvent.KEYCODE_BACK)
                              } else {
                                  finish()
                              }
                          }
                      )
                  }
                  onBackPressedDispatcher.addCallback(this,
                      object : OnBackPressedCallback(true) {
                          override fun handleOnBackPressed() {
                              if (interceptBackKeyEnabled) {
                                  forwardNativeKey("Back", KeyEvent.KEYCODE_BACK)
                              } else {
                                  isEnabled = false
                                  onBackPressedDispatcher.onBackPressed()
                              }
                          }
                      }
                  )
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  NativeBridgePlugin.deliverActivityResult(requestCode, resultCode, data)
              }
          }
          KOTLIN
          fi
          grep -F 'ReadInfinityBackDispatch' "$activity_file"
          grep -F 'class MainActivity : TauriActivity(), KeyDownInterceptor' "$activity_file"
          grep -F 'interceptBackKeyEnabled' "$activity_file"
          grep -F 'interceptPageTurnerKeysEnabled' "$activity_file"
          grep -F 'keyLearnModeEnabled' "$activity_file"
          grep -F 'window.onNativeKeyDown("$keyName", $keyCode)' "$activity_file"
          grep -F 'setupReadInfinityBackDispatcher' "$activity_file"
          grep -F 'NativeBridgePlugin.deliverActivityResult' "$activity_file"
          tail -n 42 "$activity_file"

      - name: Select FOSS Android flavor
        run: |
          app_gradle="apps/readest-app/src-tauri/gen/android/app/build.gradle.kts"
          if ! grep -q 'missingDimensionStrategy("store"' "$app_gradle"; then
            sed -i '/minSdk =/a\        missingDimensionStrategy("store", "foss")' "$app_gradle"
          fi
          grep -n 'missingDimensionStrategy("store"' "$app_gradle"

      - name: Build Android debug APK
        run: pnpm --filter @readest/readest-app tauri android build --debug -t aarch64 -- --features devtools

      - name: Locate and verify arm64-v8a APK
        id: apk
        run: |
          apk_path="$(find apps/readest-app/src-tauri/gen/android -type f -name 'app-universal-debug.apk' | head -n 1)"
          test -n "$apk_path"
          badging="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$apk_path")"
          printf '%s\n' "$badging"
          grep -F 'com.infinity.readz' <<< "$badging"
          grep -F 'Read∞' <<< "$badging"
          unzip -l "$apk_path" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$apk_path" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native library found in APK'
            exit 1
          fi
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"
          echo "Verified arm64-v8a-only APK: $apk_path"

      - name: Upload Android arm64-v8a debug APK
        uses: actions/upload-artifact@v4
        with:
          name: readinfinity-android-arm64-v8a-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
